<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Research Opportunity Portal</span>
      <button class="btn btn-light" id="addBtn">+ Add Opportunity</button>
    </div>
  </nav>

  <div class="container">
    <div id="message"></div>
    <div class="row" id="list"></div>
  </div>

  <!-- Details popup -->
  <div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailsTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailsBody"></div>
      </div>
    </div>
  </div>

  <!-- Add / Edit form popup -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="formTitle">Add Opportunity</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formError" class="text-danger mb-2"></div>
          <input type="hidden" id="oppId">

          <div class="mb-2">
            <label class="form-label">Research Title</label>
            <input type="text" class="form-control" id="title">
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-2">
              <label class="form-label">Research Area</label>
              <input type="text" class="form-control" id="research_area">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Faculty Member Name</label>
              <input type="text" class="form-control" id="faculty_name">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="department">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Required Skills</label>
              <input type="text" class="form-control" id="required_skills">
            </div>
            <div class="col-md-4 mb-2">
              <label class="form-label">Available Positions</label>
              <input type="number" class="form-control" id="available_positions" min="0">
            </div>
            <div class="col-md-4 mb-2">
              <label class="form-label">Application Deadline</label>
              <input type="date" class="form-control" id="application_deadline">
            </div>
            <div class="col-md-4 mb-2">
              <label class="form-label">Status</label>
              <select class="form-select" id="status">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
